<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🦋 Butterfly Classifier</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f4ff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 40px;
      width: 480px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.1);
      text-align: center;
    }

    h1 { font-size: 1.8rem; color: #3b3b8f; margin-bottom: 6px; }
    p.sub { color: #888; margin-bottom: 28px; font-size: 0.95rem; }

    .upload-area {
      border: 2px dashed #b0b8e8;
      border-radius: 12px;
      padding: 30px;
      cursor: pointer;
      transition: background 0.2s;
      margin-bottom: 20px;
    }
    .upload-area:hover { background: #f5f7ff; }
    .upload-area input { display: none; }
    .upload-area label { cursor: pointer; color: #5a5abf; font-weight: 600; }

    #preview {
      max-width: 100%;
      max-height: 220px;
      border-radius: 10px;
      margin: 16px auto;
      display: none;
    }

    button {
      background: #4f4fbf;
      color: white;
      border: none;
      padding: 12px 32px;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s;
    }
    button:hover { background: #3b3b9f; }
    button:disabled { background: #aaa; cursor: not-allowed; }

    #result { margin-top: 28px; text-align: left; }

    .result-main {
      background: #eef0ff;
      border-radius: 10px;
      padding: 16px 20px;
      margin-bottom: 16px;
    }
    .result-main h2 { color: #3b3b8f; font-size: 1.3rem; }
    .result-main span { color: #666; font-size: 0.9rem; }

    .top5 h3 { font-size: 0.9rem; color: #888; margin-bottom: 10px; }

    .bar-row { margin-bottom: 8px; }
    .bar-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      margin-bottom: 3px;
      color: #444;
    }
    .bar-bg {
      background: #e8eaf6;
      border-radius: 6px;
      height: 8px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      background: #5a5abf;
      border-radius: 6px;
      transition: width 0.6s ease;
    }

    .error { color: #c0392b; margin-top: 16px; font-size: 0.9rem; }
  </style>
</head>
<body>
<div class="card">
  <h1>🦋 Butterfly Classifier</h1>
  <p class="sub">Upload an image to identify the species</p>

  <div class="upload-area" onclick="document.getElementById('fileInput').click()">
    <input type="file" id="fileInput" accept="image/*" onchange="previewImage(event)" />
    <label>Click to upload an image</label>
    <p style="color:#aaa; font-size:0.8rem; margin-top:6px;">JPG, PNG supported</p>
  </div>

  <img id="preview" alt="Preview" />

  <button id="predictBtn" onclick="predict()" disabled>Classify</button>

  <div id="result"></div>
</div>

<script>
  function previewImage(event) {
    const file = event.target.files[0];
    if (!file) return;
    const preview = document.getElementById('preview');
    preview.src = URL.createObjectURL(file);
    preview.style.display = 'block';
    document.getElementById('predictBtn').disabled = false;
    document.getElementById('result').innerHTML = '';
  }

  async function predict() {
    const file = document.getElementById('fileInput').files[0];
    if (!file) return;

    const btn = document.getElementById('predictBtn');
    btn.disabled = true;
    btn.textContent = 'Classifying…';

    const formData = new FormData();
    formData.append('file', file);

    try {
      const response = await fetch('/predict', { method: 'POST', body: formData });
      const data     = await response.json();

      if (data.error) {
        document.getElementById('result').innerHTML =
          `<p class="error">⚠️ ${data.error}</p>`;
        return;
      }

      // Build top-5 bars
      const bars = data.top5.map(item => `
        <div class="bar-row">
          <div class="bar-label">
            <span>${item.label}</span>
            <span>${item.probability.toFixed(1)}%</span>
          </div>
          <div class="bar-bg">
            <div class="bar-fill" style="width:${item.probability}%"></div>
          </div>
        </div>
      `).join('');

      document.getElementById('result').innerHTML = `
        <div class="result-main">
          <h2>🦋 ${data.prediction}</h2>
          <span>Confidence: ${data.confidence.toFixed(1)}%</span>
        </div>
        <div class="top5">
          <h3>TOP 5 PREDICTIONS</h3>
          ${bars}
        </div>
      `;
    } catch (err) {
      document.getElementById('result').innerHTML =
        `<p class="error">⚠️ Something went wrong. Is the server running?</p>`;
    } finally {
      btn.disabled = false;
      btn.textContent = 'Classify';
    }
  }
</script>
</body>
</html>
